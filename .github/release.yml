# Sections of the release notes that the Release workflow generates
# (gh release create --generate-notes), by pull request label. Label a pull
# request skip-changelog to leave it out, e.g. the dev → main release PR.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Security
      labels: [security]
    - title: Features
      labels: [enhancement, feature]
    - title: Fixes
      labels: [bug, fix]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
