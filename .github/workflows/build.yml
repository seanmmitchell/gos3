name: Build

# Reusable build shared by release.yml (tagged releases from main) and
# dev-build.yml (every push to dev): runs the Go and web tests, builds the
# embedded web UI, cross-compiles embedded and headless binaries for every
# release platform and, when image-tags is set, pushes both multi-arch images to
# ghcr.io/<owner>/<repo> with a signed build provenance attestation. The
# archives are uploaded as bin-<os>-<arch>[-headless] artifacts for the caller.

on:
  workflow_call:
    inputs:
      ref:
        # A full SHA, never a branch or tag name: for a bare name
        # actions/checkout prefers a branch over a tag, so a branch named
        # like a release tag would be built in its place. Every job checks
        # that it checked out exactly this commit.
        description: Full 40-character commit SHA to build.
        required: true
        type: string
      version:
        description: Version stamped into the binaries, e.g. v1.2.3 or v1.2.4-dev.7+0123456789ab.
        required: true
        type: string
      image-tags:
        description: docker/metadata-action tags for the ghcr.io image; empty skips the image.
        required: false
        type: string
        default: ""
      image-latest:
        description: docker/metadata-action "latest" flavor (auto, true or false).
        required: false
        type: string
        default: "false"
      use-cache:
        # GitHub Actions caches are shared across branches: a run on main
        # restores entries written by runs on the default branch (dev), and
        # any code running in a dev job (tests, npm or pip packages, tools)
        # can write cache entries. Go does not re-verify a restored module or
        # build cache, nor BuildKit a restored layer, so release builds must
        # not restore caches at all (release.yml sets false).
        description: Restore and save the Go module/build caches and the BuildKit layer cache.
        required: false
        type: boolean
        default: true
      cache-scope:
        description: Buildx cache scope (when use-cache is true).
        required: false
        type: string
        default: gos3
      retention-days:
        description: Days to keep the bin-* artifacts.
        required: false
        type: number
        default: 3

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  CI: "true"
  NUXT_TELEMETRY_DISABLED: "1"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  REF: ${{ inputs.ref }}
  VERSION: ${{ inputs.version }}

jobs:
  # Nothing is built or published unless the commit passes the Go checks (the
  # full matrix, including the Playwright suites, runs in ci.yml on every pull
  # request and is required before anything reaches dev or main).
  test:
    name: Go (vet, test, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - name: Built commit is ${{ env.REF }}
        run: |
          if ! [[ $REF =~ ^[0-9a-f]{40}$ ]] || [ "$(git rev-parse HEAD)" != "$REF" ]; then
            echo "::error::Checked out $(git rev-parse HEAD), expected the commit $REF."
            exit 1
          fi
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: ${{ inputs.use-cache }}
      - run: go vet ./...
      # Run the restic repository tests too (they skip without restic).
      - uses: ./.github/actions/setup-restic
      - run: go test -race -count=1 ./cmd/... ./internal/...
      - run: go test -race -count=1 ./test/e2e/...

  # The web unit tests run in their own job: test-only packages (vitest,
  # happy-dom, @nuxt/test-utils, ...) never run in the job that produces the
  # UI embedded into the binaries.
  ui-test:
    name: Web UI (typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - name: Built commit is ${{ env.REF }}
        run: |
          if ! [[ $REF =~ ^[0-9a-f]{40}$ ]] || [ "$(git rev-parse HEAD)" != "$REF" ]; then
            echo "::error::Checked out $(git rev-parse HEAD), expected the commit $REF."
            exit 1
          fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Typecheck and test
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test

  ui:
    name: Build embedded UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - name: Built commit is ${{ env.REF }}
        run: |
          if ! [[ $REF =~ ^[0-9a-f]{40}$ ]] || [ "$(git rev-parse HEAD)" != "$REF" ]; then
            echo "::error::Checked out $(git rev-parse HEAD), expected the commit $REF."
            exit 1
          fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      # Production dependencies only: `nuxt generate` needs none of the
      # devDependencies, so their code never runs next to the shipped UI.
      - name: Build (pnpm generate:embed)
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile --prod
          pnpm generate:embed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-embed
          path: web/.output/public/
          retention-days: 3

  binaries:
    name: gos3 ${{ matrix.goos }}/${{ matrix.goarch }} (${{ matrix.variant.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ui, ui-test]
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        variant:
          - name: embedded
            tags: ""
            suffix: ""
          - name: headless
            tags: noui
            suffix: -headless
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - name: Built commit is ${{ env.REF }}
        run: |
          if ! [[ $REF =~ ^[0-9a-f]{40}$ ]] || [ "$(git rev-parse HEAD)" != "$REF" ]; then
            echo "::error::Checked out $(git rev-parse HEAD), expected the commit $REF."
            exit 1
          fi
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: ${{ inputs.use-cache }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.variant.name == 'embedded'
        with:
          name: ui-embed
          path: ui-embed
      - name: Embed the UI
        if: matrix.variant.name == 'embedded'
        # Same steps as `make ui`: replace the placeholder with the build.
        run: |
          dist=internal/webui/dist
          find "$dist" -mindepth 1 -maxdepth 1 ! -name .keep -exec rm -rf {} +
          cp -R ui-embed/. "$dist/"
          test -f "$dist/index.html" || cp "$dist/200.html" "$dist/index.html"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          GO_TAGS: ${{ matrix.variant.tags }}
          VARIANT_SUFFIX: ${{ matrix.variant.suffix }}
        run: |
          pkg=github.com/seanmmitchell/gos3/internal/version
          commit="$(git rev-parse --short=12 HEAD)"
          date="$(git log -1 --format=%cI HEAD)"
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          name="gos3_${VERSION#v}_${GOOS}_${GOARCH}${VARIANT_SUFFIX}"
          mkdir -p "build/$name" dist
          go mod verify
          # A headless archive must exclude even the checked-in placeholder.
          if [ "$GO_TAGS" = noui ]; then
            test "$(go list -tags noui -f '{{len .EmbedFiles}}' ./internal/webui)" = 0
          fi
          go build -tags "$GO_TAGS" -trimpath \
            -ldflags "-s -w -X $pkg.Version=$VERSION -X $pkg.Commit=$commit -X $pkg.Date=$date" \
            -o "build/$name/gos3$ext" ./cmd/gos3
          cp LICENSE THIRD_PARTY_NOTICES README.md "build/$name/"
          if [ "$GOOS" = windows ]; then
            (cd build && zip -qr "../dist/$name.zip" "$name")
          else
            tar -C build -czf "dist/$name.tar.gz" "$name"
          fi
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.variant.suffix }}
          path: dist/*
          retention-days: ${{ inputs.retention-days }}

  image:
    name: Container image (ghcr.io, ${{ matrix.variant.target }})
    if: inputs.image-tags != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only publish an image for a commit whose binaries built.
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        variant:
          - target: embedded
            suffix: ""
          - target: headless
            suffix: -headless
    # id-token and attestations: sign the build provenance attestation
    # (Sigstore, via the job's OIDC token) and store it with the repository.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - name: Built commit is ${{ env.REF }}
        run: |
          if ! [[ $REF =~ ^[0-9a-f]{40}$ ]] || [ "$(git rev-parse HEAD)" != "$REF" ]; then
            echo "::error::Checked out $(git rev-parse HEAD), expected the commit $REF."
            exit 1
          fi
      - name: Build metadata
        id: vars
        run: |
          echo "commit=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: ${{ inputs.image-tags }}
          flavor: |
            latest=${{ inputs.image-latest }}
            suffix=${{ matrix.variant.suffix }},onlatest=true
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.variant.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ steps.vars.outputs.commit }}
            DATE=${{ steps.vars.outputs.date }}
          # Without use-cache (releases), nothing is read from or written to
          # the GitHub Actions cache and every layer is rebuilt.
          no-cache: ${{ !inputs.use-cache }}
          cache-from: ${{ inputs.use-cache && format('type=gha,scope=gos3-{0}-{1}', inputs.cache-scope, matrix.variant.target) || '' }}
          cache-to: ${{ inputs.use-cache && format('type=gha,mode=max,scope=gos3-{0}-{1}', inputs.cache-scope, matrix.variant.target) || '' }}
          provenance: mode=max
          sbom: true
      # Verify with: gh attestation verify oci://ghcr.io/<owner>/<repo>:<tag>
      #   --repo <owner>/<repo> --source-ref refs/heads/main (docs/releasing.md)
      # GitHub stores attestations only for public repositories (and private
      # ones on GitHub Enterprise Cloud); for a user-owned private repository
      # it refuses them, so the step is skipped while gos3 is private.
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false
      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io
