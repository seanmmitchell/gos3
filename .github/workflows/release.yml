name: Release

# Cut a release from main: Actions → Release → Run workflow, branch main, pick
# the SemVer bump. The workflow tags main's head as the next version (the
# newest vMAJOR.MINOR.PATCH tag, bumped), tests and builds it with build.yml,
# pushes the multi-arch image to ghcr.io/<owner>/<repo> and publishes a GitHub
# release with the archives, checksums and generated notes. Started again on a
# commit that already carries a release tag, it rebuilds that release instead
# of bumping, so a failed run can simply be repeated. See docs/releasing.md.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the newest release version to increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Tag the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Releases are cut from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the Release workflow on main, not $GITHUB_REF."
          exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Create the tag
        id: tag
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          tag="$(.github/scripts/release-version.sh next "$BUMP")"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already tags $(git rev-parse --short=12 HEAD); rebuilding it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "gos3 $tag"
            git push origin "refs/tags/$tag"
            echo "Tagged $(git rev-parse --short=12 HEAD) as $tag."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.version.outputs.tag }}
      version: ${{ needs.version.outputs.tag }}
      # No floating major tag before 1.0.0: 0.x minor releases may break.
      image-tags: |
        type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
        type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
        type=semver,pattern={{major}},value=${{ needs.version.outputs.tag }},enable=${{ !startsWith(needs.version.outputs.tag, 'v0.') }}
      image-latest: auto
      cache-scope: release

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [version, build]
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum gos3_* > checksums.txt
          cat checksums.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "gos3 $TAG" --generate-notes
          fi
