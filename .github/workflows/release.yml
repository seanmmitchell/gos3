name: Release

# Cut a release from main: Actions → Release → Run workflow, branch main, pick
# the SemVer bump. The workflow tags main's head as the next version (the
# newest vMAJOR.MINOR.PATCH tag, bumped), tests and builds it with build.yml,
# pushes the multi-arch image to ghcr.io/<owner>/<repo> and publishes a GitHub
# release with the archives, checksums and generated notes. The archives and
# the image carry signed build provenance attestations. Started again on a
# commit that already carries a release tag whose release is not published
# yet, it rebuilds that release instead of bumping, so a failed run can
# simply be repeated. See docs/releasing.md.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the newest release version to increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Tag the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The release-tag-creation ruleset lets only repository admins and deploy
    # keys create v* tags. The tag is pushed with the deploy key in the
    # RELEASE_DEPLOY_KEY secret of the "release" environment, which only runs
    # on main (both set up by .github/rulesets/apply.sh), so GITHUB_TOKEN
    # needs no write access and a workflow on another branch cannot tag.
    environment: release
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Releases are cut from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the Release workflow on main, not $GITHUB_REF."
          exit 1
      - name: The release deploy key is configured
        env:
          HAVE_KEY: ${{ secrets.RELEASE_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAVE_KEY" != true ]; then
            echo "::error::The release environment has no RELEASE_DEPLOY_KEY secret; run .github/rulesets/apply.sh (docs/releasing.md)."
            exit 1
          fi
      # Checked out over SSH with the deploy key, which `git push` below uses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          persist-credentials: true
      - name: Create the tag
        id: tag
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$(.github/scripts/release-version.sh next "$BUMP")"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            # A published release is never rebuilt: its assets and image tags
            # would be replaced by a second, different build.
            draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
            if [ "$draft" = false ]; then
              echo "::error::$tag is already released; merge a new change into main to release again."
              exit 1
            fi
            echo "$tag already tags $(git rev-parse --short=12 HEAD); rebuilding it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "gos3 $tag"
            git push origin "refs/tags/$tag"
            echo "Tagged $(git rev-parse --short=12 HEAD) as $tag."
          fi
          # The build checks out this full commit SHA, never the tag's bare
          # name: actions/checkout prefers a branch over a tag of the same
          # name, so a pushed v* branch would otherwise be built instead.
          commit="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
          if [ "$commit" != "$(git rev-parse HEAD)" ]; then
            echo "::error::$tag tags $commit, not main's head $(git rev-parse HEAD)."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    # id-token and attestations: only build.yml's image job uses them, to
    # attest the image's build provenance.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.version.outputs.commit }}
      version: ${{ needs.version.outputs.tag }}
      # No floating major tag before 1.0.0: 0.x minor releases may break.
      image-tags: |
        type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
        type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
        type=semver,pattern={{major}},value=${{ needs.version.outputs.tag }},enable=${{ !startsWith(needs.version.outputs.tag, 'v0.') }}
      image-latest: auto
      # Caches are writable by any job on dev; a release restores none.
      use-cache: false

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [version, build]
    # actions: list this run's artifacts.
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Every job of this run can upload artifacts, including build.yml's
      # test jobs, which run devDependencies and test-only modules. Only the
      # binaries matrix's 12 bin-<os>-<arch>[-headless] names are accepted,
      # each once, and they are then downloaded by immutable ID. Names are
      # unique within a run: if another job took one of them first, the
      # binaries upload failed and this job never runs; any other bin-* name
      # fails here. (The artifacts API does not say which job uploaded an
      # artifact, so the producer cannot be checked directly.)
      - name: Only the expected binary artifacts
        id: artifacts
        # Plain bash 3 (no associative arrays), so the tests run it anywhere.
        run: |
          expected=() found=()
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              for suffix in "" -headless; do
                expected+=("bin-$os-$arch$suffix")
                found+=("")
              done
            done
          done
          listing="$(gh api --paginate --jq '.artifacts[] | [.id, .name, .expired] | @tsv' \
            "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")"
          fail=0
          while IFS=$'\t' read -r id name expired; do
            [[ $name == bin-* ]] || continue
            i=-1
            for j in "${!expected[@]}"; do
              if [ "${expected[$j]}" = "$name" ]; then i=$j; fi
            done
            if [ "$i" -lt 0 ]; then
              echo "::error::Unexpected artifact $name ($id) in this run."
              fail=1
            elif [ -n "${found[$i]}" ]; then
              echo "::error::Artifact $name appears more than once."
              fail=1
            elif [[ $expired != false || ! $id =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Artifact $name ($id) is expired or has no valid ID."
              fail=1
            else
              found[$i]=$id
            fi
          done <<<"$listing"
          ids=()
          for i in "${!expected[@]}"; do
            if [ -z "${found[$i]}" ]; then
              echo "::error::Artifact ${expected[$i]} is missing."
              fail=1
            else
              ids+=("${found[$i]}")
            fi
          done
          [ "$fail" = 0 ] || exit 1
          (IFS=,; echo "ids=${ids[*]}") >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.artifacts.outputs.ids }}
          path: dist
          merge-multiple: true
      # dist must hold exactly this version's 12 archives; only they are
      # checksummed, attested and uploaded, by name.
      - name: Verify and checksum the archives
        id: archives
        working-directory: dist
        run: |
          want=()
          for os in linux darwin windows; do
            ext=.tar.gz
            if [ "$os" = windows ]; then ext=.zip; fi
            for arch in amd64 arm64; do
              for suffix in "" -headless; do
                want+=("gos3_${TAG#v}_${os}_${arch}${suffix}${ext}")
              done
            done
          done
          if ! diff <(printf '%s\n' "${want[@]}" | LC_ALL=C sort) <(find . -mindepth 1 | sed 's|^\./||' | LC_ALL=C sort); then
            echo "::error::dist does not hold exactly the 12 archives of $TAG."
            exit 1
          fi
          for f in "${want[@]}"; do
            if [ ! -f "$f" ] || [ -L "$f" ]; then
              echo "::error::$f is not a regular file."
              exit 1
            fi
          done
          if command -v sha256sum >/dev/null; then
            sha256sum -- "${want[@]}" > checksums.txt
          else
            shasum -a 256 -- "${want[@]}" > checksums.txt # macOS (tests)
          fi
          cat checksums.txt
          {
            echo "subjects<<EOF"
            printf 'dist/%s\n' "${want[@]}"
            echo EOF
            echo "assets<<EOF"
            printf 'dist/%s\n' "${want[@]}" checksums.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"
      # Verify with: gh attestation verify gos3_<version>_<os>_<arch>.tar.gz
      #   --repo <owner>/<repo> --source-ref refs/heads/main (docs/releasing.md)
      # gos3 is public; keep the visibility guard for private forks, as in
      # build.yml's image job.
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archives.outputs.subjects }}
      # Only a draft created by this run may be published. A pre-existing
      # draft may contain foreign notes or assets and is never reused.
      # Assets of a published release are never replaced (the version job
      # refuses to rebuild one; with release immutability on, GitHub refuses
      # too).
      - name: Create, upload and publish the release
        env:
          ASSETS: ${{ steps.archives.outputs.assets }}
        run: |
          assets=()
          while IFS= read -r a; do
            if [ -n "$a" ]; then assets+=("$a"); fi
          done <<<"$ASSETS"
          # Create fails if any release already exists, including a draft.
          # Never upload to or publish a release this run did not create.
          gh release create "$TAG" --verify-tag --draft --title "gos3 $TAG" --generate-notes
          gh release upload "$TAG" "${assets[@]}"
          gh release edit "$TAG" --draft=false
