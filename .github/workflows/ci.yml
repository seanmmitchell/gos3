name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' }}

env:
  NODE_VERSION: "22"
  CI: "true"
  NUXT_TELEMETRY_DISABLED: "1"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  go:
    name: Go (fmt, vet, test, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal test)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy is clean
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # The real local and remote-S3 restic repository tests skip without
      # restic; install the pinned release the container images bundle.
      - uses: ./.github/actions/setup-restic
      - name: Unit tests (race)
        run: go test -race -count=1 ./cmd/... ./internal/...
      - name: Headless build and mode tests
        run: |
          go build -tags noui ./cmd/gos3
          go test -race -tags noui ./internal/config ./internal/webui ./internal/server ./cmd/gos3
      - name: End-to-end tests (race)
        run: go test -race -count=1 ./test/e2e/...

  go-platforms:
    # Release archives are published for macOS and Windows too, so the suites
    # run there as well (file locking, renaming open files and multicast
    # differ). Both jobs are required checks in .github/rulesets.
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Run the restic repository tests here too (process handling, paths
      # and file locking differ).
      - uses: ./.github/actions/setup-restic
      # Durable filesystem suites perform thousands of disk flushes. On
      # Windows runners these can exceed Go's default 10-minute package
      # timeout; keep all tests enabled within the 30-minute job budget.
      - name: Unit tests
        run: go test -timeout=20m -count=1 ./cmd/... ./internal/...
      - name: End-to-end tests
        run: go test -count=1 ./test/e2e/...

  web:
    name: Web UI (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      embedded-artifact-id: ${{ steps.embedded.outputs.artifact-id }}
      standalone-artifact-id: ${{ steps.standalone.outputs.artifact-id }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # For the THIRD_PARTY_NOTICES check (internal/tools/notices).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          pnpm --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Standalone build
        run: |
          pnpm build
          # Keep Nitro's symlinks and file modes across artifact transfer.
          tar -C .output -cf ui-standalone.tar .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: standalone
        with:
          name: ci-ui-standalone
          path: web/ui-standalone.tar
          retention-days: 7
      - name: Embedded build
        run: pnpm generate:embed
      - name: Standalone render smoke test
        env:
          E2E_UI_ONLY: "1"
          E2E_REAL_ONLY: "1"
        run: pnpm exec playwright test --project=standalone-setup
      # Both builds above record the npm packages they ship in web/.notices.
      - name: THIRD_PARTY_NOTICES is up to date
        working-directory: .
        run: go run ./internal/tools/notices -check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: embedded
        with:
          name: ci-ui-embed
          path: web/.output/public/
          retention-days: 7

  playwright:
    name: Playwright (mocked, real server, standalone)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [web]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
      E2E_SKIP_UI_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          echo "PNPM_STORE=$(cd web && pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      # These artifacts belong to this run's web producer. Publishing builds
      # still build their own UI in an isolated production-only job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.web.outputs.embedded-artifact-id }}
          path: web/.output/public
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.web.outputs.standalone-artifact-id }}
          path: web/.e2e-cache
          merge-multiple: true
      - name: Prepare UI builds and gos3
        run: |
          cd web && pnpm install --frozen-lockfile && cd ..
          mkdir -p web/.e2e-cache/standalone-output
          tar -xf web/.e2e-cache/ui-standalone.tar -C web/.e2e-cache/standalone-output
          dist=internal/webui/dist
          find "$dist" -mindepth 1 -maxdepth 1 ! -name .keep -exec rm -rf {} +
          cp -R web/.output/public/. "$dist/"
          test -f "$dist/index.html" || cp "$dist/200.html" "$dist/index.html"
          make build-go
      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Mocked UI tests
        working-directory: web
        run: pnpm test:e2e
      - name: Real-server tests (embedded UI in bin/gos3)
        working-directory: web
        env:
          GOS3_BIN: ${{ github.workspace }}/bin/gos3
        run: pnpm test:e2e:real
      - name: Standalone UI tests (cross-origin)
        working-directory: web
        env:
          GOS3_BIN: ${{ github.workspace }}/bin/gos3
        run: pnpm test:e2e:standalone
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7

  compat:
    name: Compatibility (boto3, AWS CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOS3_COMPAT_VENV: ${{ github.workspace }}/.compat-venv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.13"
      # A venv links to its interpreter's absolute path, so the key includes
      # the exact Python version: a runner image with a new 3.13.x starts a
      # fresh venv instead of restoring one with dangling links.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOS3_COMPAT_VENV }}
          key: compat-venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('test/compat/requirements.txt') }}
      - name: Run test/compat/run.sh
        run: test/compat/run.sh

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build gos3 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: gos3:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=gos3
          cache-to: type=gha,mode=max,scope=gos3
      - name: Smoke test gos3 image
        run: |
          docker run -d --name gos3 -p 9000:9000 \
            -e GOS3_ROOT_ACCESS_KEY=ciroot -e GOS3_ROOT_SECRET_KEY=ciroot-secret gos3:ci
          for i in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' gos3)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs gos3
          [ "$status" = healthy ] || { echo "::error::container is $status"; exit 1; }
          curl -fsS http://127.0.0.1:9000/_gos3/ready
          curl -fsS http://127.0.0.1:9000/_gos3/info | grep -q '"ui"'
          curl -fsS http://127.0.0.1:9000/_gos3/ui/ | grep -qi '<html'
          # The bundled restic (Dockerfile, restic stage) runs in the image.
          docker exec gos3 /usr/local/bin/restic version
          docker rm -f gos3
      - name: Build headless gos3 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: headless
          load: true
          tags: gos3:headless-ci
          cache-from: type=gha,scope=gos3
      - name: Smoke test headless S3-only image
        run: |
          docker run -d --name gos3-headless -p 9000:9000 \
            -e MINIO_ROOT_USER=ciroot -e MINIO_ROOT_PASSWORD=ciroot-secret \
            gos3:headless-ci server /data --address :9000 --no-admin
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/ready && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:9000/minio/health/ready
          curl -fsS http://127.0.0.1:9000/minio/health/live
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/_gos3/ui/)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/_gos3/admin/v1/config)" = 404
          docker exec gos3-headless /usr/local/bin/restic version
          docker rm -f gos3-headless
      - name: Build standalone UI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          load: true
          tags: gos3-ui:ci
          cache-from: type=gha,scope=gos3-ui
          cache-to: type=gha,mode=max,scope=gos3-ui
      - name: Validate docker-compose.yml
        # The demo has no default root keys; it must refuse to start without.
        run: |
          if docker compose --profile ui config --quiet 2>/dev/null; then
            echo "::error::docker-compose.yml accepted missing root keys"; exit 1
          fi
          GOS3_ROOT_ACCESS_KEY=ciroot GOS3_ROOT_SECRET_KEY=ciroot-secret \
            docker compose --profile ui config --quiet

  dev-build:
    name: Dev build
    # Validate this exact push once, including every platform and deployment
    # mode, before publishing. PR and manual CI runs never publish.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [go, go-platforms, web, playwright, compat, docker]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/dev-build.yml
