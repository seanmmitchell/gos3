name: Dev build

# Called by CI after every check passes for a push to dev. Builds what the
# next release would ship: archives for all platforms (bin-<os>-<arch>
# artifacts of this run, kept 30 days) and the
# multi-arch image ghcr.io/<owner>/<repo>:dev, also tagged dev-<commit>.
# Headless archives and image tags append -headless. The
# version is the next patch release as a prerelease, e.g.
# v0.1.1-dev.42+0123456789ab. Nothing is published on the Releases page. See
# docs/releasing.md.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  version:
    name: Version
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: version
        run: |
          version="$(.github/scripts/release-version.sh dev "$GITHUB_RUN_NUMBER")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "Dev build $version"

  build:
    name: Build
    needs: version
    # id-token and attestations: build.yml's image job attests the image's
    # build provenance (verifiable with --source-ref refs/heads/dev).
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}
      image-tags: |
        type=raw,value=dev
        type=raw,value=dev-${{ needs.version.outputs.commit }}
      cache-scope: dev
      retention-days: 30
      # The calling CI run has validated github.sha with the full suite.
      run-tests: false
