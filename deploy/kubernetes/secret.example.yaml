# Root credentials. EXAMPLE ONLY: replace the values (generate a pair with
# `gos3 keygen`), or create the Secret directly:
#
#   kubectl create secret generic gos3-root-credentials \
#     --from-literal=access-key=... --from-literal=secret-key=...
#
# Access key: 3-128 characters of [A-Za-z0-9._-]; secret: 8-128 printable
# characters without spaces. Without this Secret (make the env references in
# the StatefulSet optional), each server generates its own pair on first start
# and logs it once (kubectl logs gos3-0).
apiVersion: v1
kind: Secret
metadata:
  name: gos3-root-credentials
  labels:
    app.kubernetes.io/name: gos3
type: Opaque
stringData:
  access-key: CHANGE-ME-ACCESS-KEY
  secret-key: CHANGE-ME-secret-key-at-least-8-chars
