# Root credentials. EXAMPLE ONLY, and deliberately not listed in
# kustomization.yaml. Prefer creating the Secret directly (generate a pair
# with `gos3 keygen`):
#
#   kubectl create secret generic gos3-root-credentials \
#     --from-literal=access-key=... --from-literal=secret-key=...
#
# or copy this file outside the repository, replace both values and
# `kubectl apply -f` it. Never deploy the placeholder values below.
#
# Access key: 3-128 characters of [A-Za-z0-9._-]; secret: 8-128 printable
# characters without spaces. Without this Secret (the StatefulSet's
# references to it are optional), each server generates its own pair on
# first start and logs it once (kubectl logs gos3-0). Creating the Secret
# later takes effect when the pods restart.
apiVersion: v1
kind: Secret
metadata:
  name: gos3-root-credentials
  labels:
    app.kubernetes.io/name: gos3
type: Opaque
stringData:
  access-key: CHANGE-ME-ACCESS-KEY
  secret-key: CHANGE-ME-secret-key-at-least-8-chars
