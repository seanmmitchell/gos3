# gos3 StatefulSet. Each replica is an independent server (own PVC, own
# server ID, own buckets); replicas find each other through the headless
# Service's DNS SRV records and show up on each other's Discovery page.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gos3
  labels:
    app.kubernetes.io/name: gos3
spec:
  serviceName: gos3-headless
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: gos3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gos3
    spec:
      # SIGTERM → graceful shutdown (server.shutdown_timeout, default 30s).
      terminationGracePeriodSeconds: 45
      enableServiceLinks: false
      # gos3 never talks to the Kubernetes API: no service account token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gos3
          # A release tag (set in kustomization.yaml), pulled only when the
          # node does not have it. Pin the digest too (kustomization.yaml)
          # so a re-pushed tag cannot change what runs.
          image: ghcr.io/seanmmitchell/gos3:0.2.2
          args: ["serve"]
          ports:
            - name: gos3
              containerPort: 9000
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GOS3_CONFIG
              value: /etc/gos3/config.yaml
            - name: GOS3_DATA
              value: /data
            - name: GOS3_NAME
              value: $(POD_NAME)
            # Advertised in /_gos3/info and discovery. Use the externally
            # reachable URL (Ingress) instead when clients outside the
            # cluster should follow it.
            - name: GOS3_PUBLIC_URL
              value: http://$(POD_NAME).gos3-headless.$(POD_NAMESPACE).svc.cluster.local:9000
            # Other host names clients use, such as the Ingress host
            # (comma-separated; or server.allowed_hosts in configmap.yaml).
            # Without it, the web UI and anonymous reads through that host
            # answer 421/403.
            # - name: GOS3_ALLOWED_HOSTS
            #   value: s3.example.com,gos3,gos3.$(POD_NAMESPACE).svc.cluster.local
            - name: GOS3_DISCOVERY_DNS_SRV
              value: gos3-headless.$(POD_NAMESPACE).svc.cluster.local
            # Root keys from the Secret gos3-root-credentials, which you
            # create yourself (see secret.example.yaml). It is required: the
            # pod does not start (CreateContainerConfigError) until it
            # exists. Generated keys would only be stored on the volume,
            # which the shell-less image gives no easy way to read.
            - name: GOS3_ROOT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: gos3-root-credentials
                  key: access-key
            - name: GOS3_ROOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gos3-root-credentials
                  key: secret-key
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/gos3
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /_gos3/health
              port: gos3
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /_gos3/health
              port: gos3
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_gos3/ready
              port: gos3
            periodSeconds: 10
            timeoutSeconds: 6
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: gos3-config
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: gos3
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
