# kubectl apply -k deploy/kubernetes   (add -n <namespace> or set namespace below)
#
# Root credentials are NOT part of this kustomization, so the repository's
# example keys can never be deployed by accident. Create the Secret first
# (see secret.example.yaml); the pods do not start without it:
#
#   kubectl create secret generic gos3-root-credentials \
#     --from-literal=access-key=... --from-literal=secret-key=...
#
# A secretGenerator reading a git-ignored env file works too:
#
#   secretGenerator:
#     - name: gos3-root-credentials
#       envs: [root-credentials.env]   # access-key=... / secret-key=...
#       options:
#         disableNameSuffixHash: true
#
# networkpolicy.yaml is an optional example that limits who can reach gos3;
# adapt its namespace selectors to your cluster before enabling it below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# namespace: gos3
resources:
  - configmap.yaml
  - service.yaml
  - statefulset.yaml
  # - networkpolicy.yaml
images:
  - name: ghcr.io/seanmmitchell/gos3
    # A release version (the image tags are X.Y.Z without the v). Avoid
    # "latest": it is pulled again whenever a pod starts, so whatever was
    # pushed last runs. Tags can be re-pushed; for an immutable reference,
    # also pin the digest that `gh attestation verify` checked
    # (docs/releasing.md#verifying-a-release):
    #   digest: sha256:...
    newTag: "0.2.0"
